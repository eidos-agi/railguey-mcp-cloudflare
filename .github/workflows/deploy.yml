name: Sync Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-railguey
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Live Worker still healthy
        run: |
          echo "Deploy is Grok automation railguey-git-deploy on push to main."
          curl -sS -o /tmp/health.json -w "http=%{http_code}\n" https://railguey.eidos-agi.workers.dev/health
          python3 -c "import json,sys; d=json.load(open('/tmp/health.json')); print(d.get('ok'), d.get('name'), d.get('version')); sys.exit(0 if d.get('ok') and d.get('name')=='railguey' else 1)"
