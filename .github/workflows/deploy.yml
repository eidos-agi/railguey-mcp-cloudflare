name: Sync Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-railguey
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Pull main onto railguey.eidos-agi.workers.dev
        run: |
          echo "GITHUB_SHA=${GITHUB_SHA}"
          curl -sS -X POST "https://railguey.eidos-agi.workers.dev/__sync" \
            -H "Content-Type: application/json" \
            --data "{\"sha\":\"${GITHUB_SHA}\"}" | tee /tmp/sync.json
          python3 -c "import json,sys; d=json.load(open('/tmp/sync.json')); print(d); sys.exit(0 if d.get('ok') else 1)"
